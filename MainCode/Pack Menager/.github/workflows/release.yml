name: Build & Release TGS Pack Manager

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão para release (ex: v2.0.1)'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install client dependencies
        run: npm install --prefix src/client

      - name: Install server dependencies (production only)
        run: npm install --omit=dev --prefix src/server

      - name: Build client
        run: npm run build:client

      - name: Build & Publish
        run: npm run build:electron -- --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          EP_GH_OWNER: T1NG4
          EP_GH_REPO: TGS-pack-manager-releases
          EP_GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}

      - name: Generate latest.yml (portable auto-update)
        run: npm run generate:latest-yml

      - name: Upload latest.yml to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          $tag = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$tag"
          gh release upload $tag release/latest.yml --repo T1NG4/TGS-pack-manager-releases --clobber

      - name: Upload artifacts (best-effort)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: tgs-pack-manager-build
          path: release/
          retention-days: 3
          if-no-files-found: ignore
