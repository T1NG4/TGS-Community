name: Build & Release TGS Launcher

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão para release (ex: v1.2.3)'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: TGS Launcher/MainCode/Launcher

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build renderer (Vite)
        run: npm run build:renderer

      - name: Build & Publish Electron App
        shell: pwsh
        run: |
          @('CSC_LINK','CSC_KEY_PASSWORD','WIN_CSC_LINK','WIN_CSC_KEY_PASSWORD') | ForEach-Object {
            Remove-Item -Path "Env:$_" -ErrorAction SilentlyContinue
          }
          $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
          if ('${{ vars.CODE_SIGNING_ENABLED }}' -eq 'true') {
            $csc = '${{ secrets.WIN_CSC_LINK }}'
            if ($csc) {
              $env:CSC_LINK = $csc
              $env:CSC_KEY_PASSWORD = '${{ secrets.WIN_CSC_KEY_PASSWORD }}'
            }
          }
          npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          EP_GH_OWNER: T1NG4
          EP_GH_REPO: TGS-launcher-releases
          EP_GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}

      - name: Verify installer signature
        if: vars.CODE_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter "TGS-Launcher-Setup*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Installer not found in release/" }
          $sig = Get-AuthenticodeSignature $exe.FullName
          if ($sig.Status -ne 'Valid') { throw "Signature required but status is $($sig.Status)" }

      - name: Upload build artifacts (best-effort)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: tgs-launcher-build
          path: TGS Launcher/MainCode/Launcher/release/
          retention-days: 3
          if-no-files-found: ignore
