name: Build & Release TGS Launcher

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão para release (ex: v1.2.3)'
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: TGS Launcher/MainCode/Launcher

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verificar secret RELEASES_REPO_TOKEN
        shell: pwsh
        run: |
          if ('${{ secrets.RELEASES_REPO_TOKEN }}' -eq '') {
            Write-Error @"
          RELEASES_REPO_TOKEN não configurado no repositório TGS-Community.

          1. Crie um PAT em https://github.com/settings/tokens (escopo repo, ou fine-grained com write nos *-releases)
          2. Settings → Secrets and variables → Actions → New repository secret
          3. Nome: RELEASES_REPO_TOKEN | Valor: o PAT
          4. Reexecute os workflows (Actions → Run workflow ou re-run no job v2.0.24)

          Guia: TGS Launcher/docs/GITHUB_SETUP_COMPLETE_GUIDE.md
          "@
            exit 1
          }

      - name: Verify package.json version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}" -replace '^v',''
          if ($pkg -ne $tag) {
            Write-Error "Launcher package.json ($pkg) != tag v$tag. Alinhe antes de publicar."
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build renderer (GA4 embutido)
        run: npm run build:renderer
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID_LAUNCHER != '' && secrets.GA_MEASUREMENT_ID_LAUNCHER || 'G-DF8MNV3V66' }}

      - name: Build & Publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          EP_GH_OWNER: T1NG4
          EP_GH_REPO: TGS-launcher-releases
          EP_GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ''
          CSC_KEY_PASSWORD: ''
          WIN_CSC_LINK: ''
          WIN_CSC_KEY_PASSWORD: ''

      - name: Verify installer signature
        if: vars.CODE_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter "TGS-Launcher-Setup*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Installer not found in release/" }
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "File:" $exe.Name
          Write-Host "Status:" $sig.Status
          if ($sig.SignerCertificate) { Write-Host "Publisher:" $sig.SignerCertificate.Subject }
          if ($sig.Status -eq 'Valid') {
            Write-Host "Code signing OK"
            exit 0
          }
          throw "Signature required but status is $($sig.Status)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: tgs-launcher-build
          path: TGS Launcher/MainCode/Launcher/release/
          retention-days: 7
          if-no-files-found: ignore

