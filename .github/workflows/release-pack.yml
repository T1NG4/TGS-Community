name: Build & Release TGS Pack Manager

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: TGS Launcher/MainCode/Pack Menager

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verificar secret RELEASES_REPO_TOKEN
        shell: pwsh
        run: |
          if ('${{ secrets.RELEASES_REPO_TOKEN }}' -eq '') {
            Write-Error @"
          RELEASES_REPO_TOKEN não configurado no repositório TGS-Community.

          1. Crie um PAT em https://github.com/settings/tokens (escopo repo)
          2. Settings → Secrets and variables → Actions → New repository secret
          3. Nome: RELEASES_REPO_TOKEN | Valor: o PAT
          4. Reexecute os workflows

          Guia: TGS Launcher/docs/GITHUB_SETUP_COMPLETE_GUIDE.md
          "@
            exit 1
          }

      - name: Verify package.json version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}" -replace '^v',''
          if ($pkg -ne $tag) {
            Write-Error "Pack package.json ($pkg) != tag v$tag. Alinhe antes de publicar."
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install client dependencies
        run: npm install --prefix src/client

      - name: Install server dependencies (production only)
        run: npm install --omit=dev --prefix src/server

      - name: Build client (GA4 embutido)
        run: npm run build:client
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID_PACK != '' && secrets.GA_MEASUREMENT_ID_PACK || 'G-DF8MNV3V66' }}

      - name: Build & Publish portable
        run: npm run build:electron -- --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          EP_GH_OWNER: T1NG4
          EP_GH_REPO: TGS-pack-manager-releases
          EP_GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}

      - name: Generate latest.yml
        run: npm run generate:latest-yml

      - name: Upload latest.yml to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        shell: pwsh
        run: |
          gh release upload "${{ github.ref_name }}" release/latest.yml --repo T1NG4/TGS-pack-manager-releases --clobber

      - name: Sync public docs to releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:$env:GH_TOKEN@github.com/T1NG4/TGS-pack-manager-releases.git" releases-repo
          Copy-Item releases-public/README.md releases-repo/README.md -Force
          Copy-Item releases-public/DOCUMENTATION.md releases-repo/DOCUMENTATION.md -Force
          Copy-Item releases-public/DOCUMENTACAO.md releases-repo/DOCUMENTACAO.md -Force
          Set-Location releases-repo
          git add README.md DOCUMENTATION.md DOCUMENTACAO.md
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "docs: sync public documentation (release build)"
            git push origin main
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: tgs-pack-manager-build
          path: TGS Launcher/MainCode/Pack Menager/release/
          retention-days: 7
          if-no-files-found: ignore

