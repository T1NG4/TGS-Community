name: Build & Release TGS Launcher

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão para release (ex: v1.2.3)'
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: MainCode/Launcher

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify package.json version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}" -replace '^v',''
          if ($pkg -ne $tag) {
            Write-Error "Launcher package.json ($pkg) != tag v$tag. Alinhe antes de publicar."
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build renderer (GA4 embutido)
        run: npm run build:renderer
        env:
          VITE_GA_MEASUREMENT_ID: G-DF8MNV3V66

      - name: Build & Publish
        run: npm run build:main -- --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          EP_GH_OWNER: T1NG4
          EP_GH_REPO: TGS-launcher-releases
          EP_GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: tgs-launcher-build
          path: MainCode/Launcher/release/
          retention-days: 7
          if-no-files-found: ignore
