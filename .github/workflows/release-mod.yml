name: Build & Release TGS Mod Manager

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: TGS Launcher/MainCode/Mod Menager/client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verificar secret RELEASES_REPO_TOKEN
        shell: pwsh
        run: |
          if ('${{ secrets.RELEASES_REPO_TOKEN }}' -eq '') {
            Write-Error @"
          RELEASES_REPO_TOKEN não configurado no repositório TGS-Community.

          1. Crie um PAT em https://github.com/settings/tokens (escopo repo)
          2. Settings → Secrets and variables → Actions → New repository secret
          3. Nome: RELEASES_REPO_TOKEN | Valor: o PAT
          4. Reexecute os workflows

          Guia: TGS Launcher/docs/GITHUB_SETUP_COMPLETE_GUIDE.md
          "@
            exit 1
          }

      - name: Verify package.json version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}" -replace '^v',''
          if ($pkg -ne $tag) {
            Write-Error "Mod client package.json ($pkg) != tag v$tag. Alinhe antes de publicar."
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Configure GA4 (fluxo Mod)
        shell: pwsh
        run: |
          $id = '${{ secrets.GA_MEASUREMENT_ID_MOD }}'
          if (-not $id) { $id = 'G-DF8MNV3V66' }
          @"
          window.TGS_ANALYTICS_CONFIG = {
            measurementId: '$id',
            appName: 'tgs_mod_manager',
            enabledInDev: true
          };
          "@ | Set-Content -Path analytics-config.js -Encoding utf8NoBOM

      - name: Build client
        run: npm run build

      - name: Build & Publish portable
        run: npm run package -- --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          EP_GH_OWNER: T1NG4
          EP_GH_REPO: TGS-mod-manager-releases
          EP_GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: tgs-mod-manager-build
          path: TGS Launcher/MainCode/Mod Menager/client/release/
          retention-days: 7
          if-no-files-found: ignore

